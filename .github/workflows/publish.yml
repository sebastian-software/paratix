name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish mode"
        required: true
        default: "verify"
        type: choice
        options:
          - verify
          - release

# #255 B3: never cancel a run on main. A workflow-wide cancellation also stops
# a running `publish` job (a job-level group cannot prevent that), which could
# leave a release half-published. Other refs keep cancelling superseded runs.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # Only the CI job `check` runs `pnpm rust:check`; this job builds only.
      PARATIX_RUST_CHECK: skip
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # pnpm/action-setup@v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # actions/setup-node@v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Rust toolchain
        id: rust
        working-directory: packages/ssh-native
        # rust-toolchain.toml pins the channel, components and profile.
        run: |
          rustup toolchain install --no-self-update
          rustc --version
          cargo --version
          echo "host=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
          echo "release=$(rustc -vV | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
      - name: Cache Rust build
        # actions/cache@v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/ssh-native/target/
          key: ssh-native-build-${{ runner.os }}-${{ steps.rust.outputs.host }}-rust-${{ steps.rust.outputs.release }}-${{ hashFiles('packages/ssh-native/Cargo.lock') }}
          restore-keys: |
            ssh-native-build-${{ runner.os }}-${{ steps.rust.outputs.host }}-rust-${{ steps.rust.outputs.release }}-
      - run: pnpm install --frozen-lockfile
      - name: Check Docker availability
        run: docker info
      - name: Run full review check including integration tests
        run: bash scripts/runPodmanIntegration.sh pnpm agent:check:integration
      # actions/upload-artifact@v4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-dist
          path: |
            packages/create-paratix/dist
            packages/paratix/dist
          if-no-files-found: error

  release-please-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # googleapis/release-please-action@v5
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          # Use a PAT so release-please PRs trigger downstream workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  release-please-release:
    if: github.event_name == 'push'
    needs:
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # googleapis/release-please-action@v5
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          # Use a PAT so release-please releases trigger downstream workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # #255 B3: builds the six @paratix/ssh-native binaries with the same matrix
  # as the pull request workflow and smoke-tests exactly the artifacts that
  # are published (its `sha256` output is set only after every smoke passed).
  # Runs only for a created release or a manual run; pull requests get the
  # matrix from ssh-native.yml directly. The local sshd proofs and the Docker
  # suite are skipped here: they ran on the pull request, and `validate` runs
  # the Docker integration suites of every package again.
  native:
    needs:
      - validate
      - release-please-release
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (
        needs.release-please-release.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
    uses: ./.github/workflows/ssh-native.yml
    with:
      skip-integration: true

  verify:
    needs:
      - validate
      - native
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'verify' &&
      needs.validate.result == 'success' &&
      needs.native.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # pnpm/action-setup@v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # actions/setup-node@v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false
      # actions/download-artifact@v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: package-dist
          path: packages
      # Outside the repository, so the clean-tree check stays meaningful.
      # actions/download-artifact@v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ssh-native-*
          path: ${{ runner.temp }}/ssh-native-artifacts
      - name: Pack and verify the nine package tarballs
        env:
          SSH_NATIVE_ARTIFACTS_DIR: ${{ runner.temp }}/ssh-native-artifacts
          SSH_NATIVE_SHA256: ${{ needs.native.outputs.sha256 }}
          PARATIX_PUBLISH_STAGING_DIR: ${{ runner.temp }}/paratix-publish
        run: node scripts/publishWorkspacePackages.mjs verify
      # actions/upload-artifact@v4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/paratix-publish/tarballs
          if-no-files-found: error

  publish:
    needs:
      - validate
      - release-please-release
      - native
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.validate.result == 'success' &&
      needs.native.result == 'success' &&
      (
        needs.release-please-release.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode != 'verify')
      )
    runs-on: ubuntu-24.04
    environment: npm
    # #255 B3: at most one publish at a time, and a queued publish never
    # cancels a running one.
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    # Nine sequential publishes with provenance, each followed by an
    # availability wait of up to 90 x 10 s (~15 min). Cover all nine waits
    # (~135 min) plus checkout, packing, provenance and registry uploads.
    timeout-minutes: 180
    permissions:
      contents: read
      # npm requests an OIDC token for trusted publishing.
      id-token: write
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          # The resume check compares packages/ssh-native between the commit
          # of an earlier publish run and HEAD (`git diff <commit>..HEAD`).
          fetch-depth: 0
      # pnpm/action-setup@v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # actions/setup-node@v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false
      - name: Check minimum npm version
        shell: bash
        run: |
          minimum_npm_version="11.5.1"
          installed_npm_version="$(npm --version)"
          if [ "$(printf '%s\n' "$minimum_npm_version" "$installed_npm_version" | sort -V | head -n 1)" != "$minimum_npm_version" ]; then
            echo "npm $minimum_npm_version or newer is required; installed version: $installed_npm_version." >&2
            exit 1
          fi
      # actions/download-artifact@v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: package-dist
          path: packages
      # actions/download-artifact@v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ssh-native-*
          path: ${{ runner.temp }}/ssh-native-artifacts
      # Checks every package (provenance, integrity, OIDC exchange) before the
      # first `npm publish`, then publishes the platform packages,
      # @paratix/ssh-native, paratix and create-paratix in this order.
      - name: Publish the nine packages
        env:
          SSH_NATIVE_ARTIFACTS_DIR: ${{ runner.temp }}/ssh-native-artifacts
          SSH_NATIVE_SHA256: ${{ needs.native.outputs.sha256 }}
          PARATIX_PUBLISH_STAGING_DIR: ${{ runner.temp }}/paratix-publish
        run: node scripts/publishWorkspacePackages.mjs release
      # actions/upload-artifact@v4
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/paratix-publish/tarballs
          if-no-files-found: ignore

  refresh-context7:
    needs:
      - publish
      - release-please-release
    if: >-
      always() &&
      needs.publish.result == 'success' &&
      needs.release-please-release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refresh Context7 documentation
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          if [ -z "${CONTEXT7_API_KEY}" ]; then
            echo "::error::CONTEXT7_API_KEY is not configured."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            --request POST \
            --url https://context7.com/api/v1/refresh \
            --header "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"libraryName\":\"/${GITHUB_REPOSITORY}\"}"
