name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # pnpm/action-setup@v6
      - uses: pnpm/action-setup@5d6f3fe6c685be83c141aea1141d8a825903c82a
      # actions/setup-node@v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm agent:check:integration
      # actions/upload-artifact@v4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-dist
          path: |
            packages/create-paratix/dist
            packages/paratix/dist
          if-no-files-found: error

  release-please-pr:
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # googleapis/release-please-action@v5
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          # Use a PAT so release-please PRs trigger downstream workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  release-please-release:
    if: github.event_name == 'push'
    needs:
      - validate
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # googleapis/release-please-action@v5
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          # Use a PAT so release-please releases trigger downstream workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  publish:
    needs:
      - validate
      - release-please-release
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (
        needs.release-please-release.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    permissions:
      contents: read
      # pnpm/npm request an OIDC token for npm trusted publishing even though
      # provenance is disabled while this repository is private (see R-0001025
      # in scripts/publishWorkspacePackages.mjs).
      id-token: write
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # pnpm/action-setup@v6
      - uses: pnpm/action-setup@5d6f3fe6c685be83c141aea1141d8a825903c82a
      # actions/setup-node@v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # actions/download-artifact@v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: package-dist
          path: packages
      # NOTE: npm authentication currently relies on the self-hosted runner's
      # persistent ~/.npmrc. To make it explicit and portable, add an
      # `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}` env to the publish steps
      # below — but only once an `NPM_TOKEN` repository/org secret actually
      # exists. It does not today (org secrets: CARGO_REGISTRY_TOKEN,
      # RELEASE_PLEASE_TOKEN, VERCEL_TOKEN), so wiring it now would inject an
      # empty token into setup-node's generated .npmrc and could break a
      # working publish.
      - if: github.event_name == 'push'
        run: node scripts/publishWorkspacePackages.mjs release
      - if: github.event_name == 'workflow_dispatch'
        run: node scripts/publishWorkspacePackages.mjs recover-create-paratix
