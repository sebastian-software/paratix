name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # pnpm/action-setup@v6
      - uses: pnpm/action-setup@5d6f3fe6c685be83c141aea1141d8a825903c82a
      # actions/setup-node@v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm agent:check:integration
      # actions/upload-artifact@v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-dist
          path: |
            packages/create-paratix/dist
            packages/paratix/dist
          if-no-files-found: error

  release-please-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # googleapis/release-please-action@v5
      - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062
        with:
          # Use a PAT so release-please PRs trigger downstream workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  release-please-release:
    if: github.event_name == 'push'
    needs:
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
    steps:
      # googleapis/release-please-action@v5
      - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062
        id: release
        with:
          # Use a PAT so release-please releases trigger downstream workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  publish:
    needs:
      - validate
      - release-please-release
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (
        needs.release-please-release.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # pnpm/action-setup@v6
      - uses: pnpm/action-setup@5d6f3fe6c685be83c141aea1141d8a825903c82a
      # actions/setup-node@v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package-dist
          path: packages
      - if: github.event_name == 'push'
        run: node scripts/publishWorkspacePackages.mjs release
      - if: github.event_name == 'workflow_dispatch'
        run: node scripts/publishWorkspacePackages.mjs recover-create-paratix
