name: Integration Check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  integration-check:
    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # Only the CI job `check` runs `pnpm rust:check`; this job builds only.
      PARATIX_RUST_CHECK: skip

    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup pnpm
        # pnpm/action-setup@v6.1.0
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        id: rust
        working-directory: packages/ssh-native
        # rust-toolchain.toml pins the channel, components and profile.
        run: |
          rustup toolchain install --no-self-update
          rustc --version
          cargo --version
          echo "host=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"
          echo "release=$(rustc -vV | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build
        # actions/cache@v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/ssh-native/target/
          key: ssh-native-build-${{ runner.os }}-${{ steps.rust.outputs.host }}-rust-${{ steps.rust.outputs.release }}-${{ hashFiles('packages/ssh-native/Cargo.lock') }}
          restore-keys: |
            ssh-native-build-${{ runner.os }}-${{ steps.rust.outputs.host }}-rust-${{ steps.rust.outputs.release }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Docker availability
        run: docker info

      - name: Run full review check including integration tests
        run: bash scripts/runPodmanIntegration.sh pnpm agent:check:integration
