name: Integration Check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  integration-check:
    permissions:
      contents: read

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup pnpm
        # pnpm/action-setup@v6
        uses: pnpm/action-setup@5d6f3fe6c685be83c141aea1141d8a825903c82a

      - name: Setup Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Docker availability
        # Canary: the required integration gate must run on the hosted image.
        run: docker info

      - name: Run full review check including integration tests
        run: pnpm agent:check:integration
