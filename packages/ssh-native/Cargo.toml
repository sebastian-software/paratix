[package]
name = "paratix-ssh-native"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = ["aws-lc-rs"]
aws-lc-rs = ["russh/aws-lc-rs"]
ring = ["russh/ring"]

[dependencies]
napi = { version = "3.15.0", default-features = false, features = ["napi8", "async", "tokio_rt"] }
napi-derive = "3.6.13"
russh = { version = "0.65.0", default-features = false, features = ["rsa"] }
russh-sftp = "3.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
zeroize = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
panic = "unwind"
